name: Release

# Publish a package by pushing a tag of the form `<package>-v<version>`.
#
#   Examples:
#     alien-trees-v0.1.0        → publishes packages/alien-trees at 0.1.0
#     alien-projections-v0.2.0  → publishes packages/alien-projections at 0.2.0
#     alien-resources-v0.2.0    → publishes packages/alien-resources at 0.2.0
#
# The workflow:
#   1. Parses the tag to determine which package + version
#   2. Verifies package.json version matches the tag (prevents drift)
#   3. Installs deps, builds (tsc), publishes with npm provenance
#   4. Creates a GitHub release with autogenerated notes
#
# See CLAUDE.md "Releasing" for full flow. Required GitHub secret: NPM_TOKEN.

on:
  push:
    tags:
      - "*-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub release
      id-token: write # npm provenance (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"                                  # e.g. alien-trees-v0.1.0 or tribe-v0.15.0
          PKG="${TAG%-v*}"                                          # alien-trees / tribe
          VERSION="${TAG##*-v}"                                     # 0.1.0 / 0.15.0
          # Resolve package directory: packages/ first, plugins/ as fallback.
          # Most publishable packages live in packages/; the `tribe` Claude
          # Code plugin (and other published plugins) lives in plugins/.
          if [[ -d "packages/$PKG" ]]; then
            DIR="packages/$PKG"
          elif [[ -d "plugins/$PKG" ]]; then
            DIR="plugins/$PKG"
          else
            echo "::error::tag $TAG matches neither packages/$PKG nor plugins/$PKG"
            exit 1
          fi
          MANIFEST_VERSION=$(jq -r .version "$DIR/package.json")
          if [[ "$MANIFEST_VERSION" != "$VERSION" ]]; then
            echo "::error::tag version $VERSION does not match $DIR/package.json version $MANIFEST_VERSION"
            exit 1
          fi
          echo "pkg=$PKG"          >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "dir=$DIR"          >> "$GITHUB_OUTPUT"
          echo "Publishing $PKG@$VERSION from $DIR"

      - uses: oven-sh/setup-bun@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install package deps
        run: bun install
        working-directory: ${{ steps.parse.outputs.dir }}

      # Pre-publish gate: the package's test suite must be green before build
      # and publish. Packages without a test script skip with a visible notice
      # (some primitives are tested only via their consumers).
      - name: Test package
        run: |
          if jq -e '.scripts.test' package.json >/dev/null; then
            bun run test
          else
            echo "::notice::no test script in ${{ steps.parse.outputs.dir }} — skipping pre-publish tests"
          fi
        working-directory: ${{ steps.parse.outputs.dir }}

      - name: Build package
        run: bun run build
        working-directory: ${{ steps.parse.outputs.dir }}

      # pnpm publish (not npm publish) so publishConfig.exports overrides apply.
      # npm publish ignores publishConfig.exports; pnpm applies it. bearly
      # packages keep `exports` pointing at ./src/* for Bun workspace local dev
      # and `publishConfig.exports` pointing at ./dist/* for npm consumers.
      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks --provenance
        working-directory: ${{ steps.parse.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.parse.outputs.pkg }} v${{ steps.parse.outputs.version }}
          generate_release_notes: true
