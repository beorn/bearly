name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded runs on the same ref are wasted minutes — cancel them.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: `latest` lets an upstream bun release break CI spuriously,
          # and this workflow is load-bearing for the km vendor-pin gate.
          bun-version: "1.3.14"

      # setup-bun caches only the bun BINARY; cache the install cache ourselves.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: bun-${{ runner.os }}-

      # Installs with the public sibling commits named in source-siblings.json (git-super) in
      # place of their npm releases, retrying the install 3x, then restores package.json and
      # bun.lock byte for byte: development never waits on npm (@hh/tooling/26691).
      - uses: ./.github/actions/source-siblings

      # The refactor backends discover files via ripgrep; runners don't ship it.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

  flock-native:
    name: Flock native semantics (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install package dependencies
        run: bun install
        working-directory: packages/flock

      - name: Type check
        run: bun run typecheck
        working-directory: packages/flock

      - name: Test native flock semantics
        run: bun run test
        working-directory: packages/flock
